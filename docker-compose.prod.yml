# Production : docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Seul Caddy (web) est exposé ; Postgres et l'API restent sur le réseau Docker interne.

# Réglages de la galerie, communs à l'API et au service gallery-worker
x-gallery-env: &gallery-env
  GALLERY_SHARED_DRIVE_ID: ${GALLERY_SHARED_DRIVE_ID:-}
  GALLERY_SYNC_INTERVAL_MINUTES: ${GALLERY_SYNC_INTERVAL_MINUTES:-10}
  GALLERY_URL_SIGNING_SECRET: ${GALLERY_URL_SIGNING_SECRET:-}
  GALLERY_THUMBS_DIR: /data/gallery/thumbs
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
  # Clé JSON du compte de service, déposée dans ./secrets/ sur le serveur (jamais commitée)
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google/galerie-drive.json

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: arece_db
      POSTGRES_USER: arece
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arece -d arece_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://arece:${POSTGRES_PASSWORD}@postgres:5432/arece_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      PORT: 3000
      # SSO Google Workspace (facultatif : désactivé tant que l'ID et le secret sont vides)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_WORKSPACE_DOMAIN: ${GOOGLE_WORKSPACE_DOMAIN:-arece.eu}
      # Envoi de mails (mot de passe oublié) : vide = fonction désactivée
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ERP ARECE}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      # Relance quotidienne des tâches « À faire » en retard (TASK_REMINDERS=off pour couper)
      TASK_REMINDERS: ${TASK_REMINDERS:-on}
      TASK_REMINDER_HOUR: ${TASK_REMINDER_HOUR:-8}
      # Galerie photos (facultatif : désactivée tant que GALLERY_SHARED_DRIVE_ID est vide). Voir README, « Galerie ».
      <<: *gallery-env
    volumes:
      - gallery_thumbs:/data/gallery/thumbs:ro
      - ./secrets:/run/secrets/google:ro,z
    depends_on:
      postgres:
        condition: service_healthy

  # Synchro du Drive partagé et miniatures de la galerie (même image que l'API, autre commande)
  gallery-worker:
    build: ./backend
    command: ["npm", "run", "gallery:worker"]
    restart: unless-stopped
    logging: *logging
    mem_limit: 1536m # une photo HEIC décodée prend de la place : jamais au détriment de l'ERP
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://arece:${POSTGRES_PASSWORD}@postgres:5432/arece_db
      <<: *gallery-env
    volumes:
      - gallery_thumbs:/data/gallery/thumbs
      - ./secrets:/run/secrets/google:ro,z
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging: *logging
    environment:
      # ':80' = HTTP sur l'IP ; mettre un nom de domaine (ex: erp.arece.eu) active le HTTPS automatique
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # Ancienne adresse à rediriger vers PUBLIC_URL (ex: http://34.155.160.131) ; port interne inutilisé sinon
      REDIRECT_FROM: ${REDIRECT_FROM:-:8099}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  gallery_thumbs: # miniatures (recalculables depuis le Drive : hors sauvegardes)
  caddy_data:
  caddy_config:
