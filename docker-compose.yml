# Réglages de la galerie (dev) : GALLERY_SHARED_DRIVE_ID et la clé ./secrets/galerie-drive.json pour la tester
x-gallery-env: &gallery-env
  GALLERY_SHARED_DRIVE_ID: ${GALLERY_SHARED_DRIVE_ID:-}
  GALLERY_SYNC_INTERVAL_MINUTES: ${GALLERY_SYNC_INTERVAL_MINUTES:-10}
  GALLERY_THUMBS_DIR: /data/gallery/thumbs
  JWT_SECRET: dev_secret_key_change_in_production
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google/galerie-drive.json

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arece_db
      POSTGRES_USER: arece
      POSTGRES_PASSWORD: arece_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arece -d arece_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://arece:arece_dev_password@postgres:5432/arece_db
      JWT_SECRET: dev_secret_key_change_in_production
      CORS_ORIGIN: http://localhost:3001
      PORT: 3000
      # En dev, le frontend (3001) et l'API (3000) sont sur deux ports différents
      PUBLIC_URL: http://localhost:3001
      API_PUBLIC_URL: http://localhost:3000/api
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_WORKSPACE_DOMAIN: arece.eu
      <<: *gallery-env
    volumes:
      - ./backend/src:/app/src
      - gallery_thumbs:/data/gallery/thumbs:ro
      - ./secrets:/run/secrets/google:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Galerie : synchro du Drive partagé et miniatures (inactif tant que GALLERY_SHARED_DRIVE_ID est vide)
  gallery-worker:
    build: ./backend
    restart: unless-stopped
    command: npm run gallery:worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://arece:arece_dev_password@postgres:5432/arece_db
      <<: *gallery-env
    volumes:
      - ./backend/src:/app/src
      - gallery_thumbs:/data/gallery/thumbs
      - ./secrets:/run/secrets/google:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3000/api
      # Hot reload depuis un volume monté (Windows / Docker Desktop)
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # Le websocket de hot reload doit viser le port exposé côté hôte
      WDS_SOCKET_PORT: 3001
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

volumes:
  postgres_data:
  gallery_thumbs:
